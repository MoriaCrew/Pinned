# App Hosting environment overrides: DEV backend (PIN-28).
# Merged over apphosting.yaml when the dev backend builds the `dev`
# branch. PIN-32: live Meta is enabled on dev only; the key is in
# Secret Manager and is referenced here by name (never by value).
env:
  - variable: AI_MOCK
    value: "0"
  - variable: META_API_KEY
    secret: META_API_KEY
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
  - variable: PINNED_LAB
    value: "1"
  - variable: AI_DAILY_BUDGET_USD
    value: "2"
  - variable: AI_DAILY_CALL_LIMIT
    value: "200"
  - variable: APP_BASE_URL
    value: https://dev.pinneds.com
  - variable: DATA_BACKEND
    value: firestore
  - variable: FIREBASE_PROJECT_ID
    value: moriacrew-pinned-dev
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: moriacrew-pinned-dev
  # PIN-57: dev opts into sign-in. The web config itself is
  # inherited from apphosting.yaml as Secret Manager references.
  - variable: AUTH_MODE
    value: optional
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: moriacrew-pinned-dev.firebasestorage.app
