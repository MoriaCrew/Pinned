name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_MOCK: "1" # CI never makes paid model calls (see AGENTS.md)
    steps:
      - uses: actions/checkout@v4

      - name: Docs sanity (required files present)
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/11-studio.md
          test -f docs/adr/003-studio-architecture.md
          test -f .env.example
          echo "Docs sanity OK"

      # App checks activate automatically once PIN-2 scaffolds package.json.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "20"
          cache: npm

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
