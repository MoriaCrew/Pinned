name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_MOCK: "1" # CI never makes paid model calls (see AGENTS.md)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docs sanity (required files present)
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/11-studio.md
          test -f docs/adr/003-studio-architecture.md
          test -f .env.example
          echo "Docs sanity OK"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: i18n catalog check
        run: npm run i18n:check

      - name: Build
        run: npm run build
