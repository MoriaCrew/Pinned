# App Hosting environment overrides: PROD backend (PIN-28).
# Merged over apphosting.yaml when the prod backend builds `main`.
# Live Meta AI on prod approved Oct 28 for the Oct 31-Nov 1
# weekend promotion. This file only takes effect when `main`
# is promoted; merging it to `dev` changes nothing live.
# Secrets are referenced by name (never by value) and already
# exist in the prod project's Secret Manager with accessor
# grants for the App Hosting compute service account.
env:
  - variable: AI_MOCK
    value: "0"
  - variable: META_API_KEY
    secret: META_API_KEY
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
  - variable: AI_DAILY_BUDGET_USD
    value: "2"
  - variable: AI_DAILY_CALL_LIMIT
    value: "200"
  - variable: APP_BASE_URL
    value: https://pinneds.com
  - variable: DATA_BACKEND
    value: firestore
  - variable: FIREBASE_PROJECT_ID
    value: moriacrew-pinned-prod
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: moriacrew-pinned-prod
  # PIN-57: web config inherited from apphosting.yaml as Secret
  # Manager references (prod values already stored). AUTH_MODE
  # stays inherited link-only until sign-in is proven live on
  # dev; add AUTH_MODE=optional here at promotion (PIN-76).
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: moriacrew-pinned-prod.firebasestorage.app
  # PIN-210: live billing (merge only after the operator confirms both live secrets exist in prod Secret Manager)
  # Sells the Board Plus pack (EUR 2.99: Plus + 20 creations) through
  # LIVE Stripe Checkout; grants land by webhook only. A referenced
  # secret that is missing fails the App Hosting build, so this block
  # must not reach `main` before STRIPE_SECRET_KEY and
  # STRIPE_WEBHOOK_SECRET exist in moriacrew-pinned-prod with access
  # for pinned-web (docs/15-board-plus.md, "Going live on prod").
  # Rollback: PLUS_MODE=off, then a rollout.
  - variable: PLUS_MODE
    value: stripe
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # Creations pool on (code default is off). Judging week: 30 free
  # per board = one participant's daily Policy caps (20 photos + 10
  # scenes), so a judge on a fresh board meets the daily caps before
  # the pool. Spend stays bounded by AI_DAILY_BUDGET_USD and
  # AI_DAILY_CALL_LIMIT whatever this value is.
  - variable: POLICY_OVERRIDES_JSON
    value: '{"credits":{"enabled":true,"starterMakes":30}}'
  # /PIN-210
