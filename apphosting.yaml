# Firebase App Hosting config (PIN-2). Backend creation is a one-time
# operator step once Blaze billing is linked (see PIN-2 Linear comment):
#   firebase apphosting:backends:create --project moriacrew-pinned-dev
# Secrets (META_API_KEY etc.) are referenced from Secret Manager at deploy
# time — never put secret values in this file.
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  - variable: AI_MOCK
    value: "1"
  # PIN-83: link-only everywhere until the operator enables the
  # Google provider + sets the NEXT_PUBLIC_* web config per
  # backend (docs/13-auth.md). Empty web config = sign-in UI
  # hidden, honestly; never put invented key values here.
  - variable: AUTH_MODE
    value: link-only
