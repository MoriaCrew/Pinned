# Firebase App Hosting config (PIN-2). Backend creation is a one-time
# operator step once Blaze billing is linked (see PIN-2 Linear comment):
#   firebase apphosting:backends:create --project moriacrew-pinned-dev
# Secrets (META_API_KEY etc.) are referenced from Secret Manager at deploy
# time — never put secret values in this file.
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  - variable: AI_MOCK
    value: "1"
  # PIN-57: sign-in stays link-only by default; a backend opts in
  # with AUTH_MODE=optional in its own env file. The Firebase web
  # config (public identifiers) lives in Secret Manager under the
  # same names in every project, referenced here - never literals
  # in git (docs/13-auth.md).
  - variable: AUTH_MODE
    value: link-only
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
